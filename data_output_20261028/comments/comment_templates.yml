activity:
  morning:
    templates:
      - |
        こんにちは！
        🌅 隙間時間を検知しました！朝のふくらはぎトレーニングで体を目覚めさせませんか？
        ふくらはぎは血液を心臓に戻すポンプの役割を持ち、朝に動かすことで全身の巡りが整います。
        短時間でもむくみ改善や姿勢安定につながり、一日のスタートを快適にします。
        ======================
        ふくらはぎトレーニングガイド（カーフレイズ）
        回数の目安：10〜15回を1セット、慣れてきたら2〜3セットへ
        テンポ：ゆっくり上げてゆっくり下ろす
        ======================
        スタートポジション
        ・足を肩幅に開き、まっすぐ立つ
        ・背筋を伸ばし、視線は正面
        ・必要であれば壁や椅子に軽く手を添える
        ======================
        動作説明
        1. かかとをゆっくり持ち上げてつま先立ちになる → ふくらはぎの筋肉が収縮して血流が促進される
        2. つま先立ちのまま1秒キープ → 筋肉への刺激が高まる
        3. かかとをゆっくり下ろす → 膝やアキレス腱に負担をかけず安全に実施できる
        4. これを一定のリズムで繰り返す → 朝の巡りが整い、全身が目覚める
        ======================
        注意点
        ・背中が丸まらないようにする
        ・反動を使わずゆっくり動く
        ・痛みがある場合は無理をしない
        ・バランスが不安な場合は壁に手を添える
        ======================
        効果
        ・ふくらはぎの筋力アップ
        ・血行促進によるむくみ改善
        ・足首の安定性向上
        ・朝の覚醒効果で集中力アップ
        
      image_urls:
      - "https://drive.google.com/uc?export=view&id=1OtnZeQVVlqW4oBPpI-opnGlBEOXVzvdT"

  afternoon:
    templates:
      - |
        こんにちは！
        隙間時間を検知しました。少し体を動かしてリフレッシュしましょう。

        🤸 ニートゥエルボ（立位エクササイズ）
        ニートゥエルボは、体幹と下半身を同時に使うシンプルな運動です。
        デスクワークや立ちっぱなしで固まりやすい体を動かし、血流改善や姿勢のリセットにつながります。
        短時間でも全身をバランスよく刺激できます。

        ======================
        エクササイズガイド
        回数の目安：左右交互に10回ずつ（合計20回）
        運動時間：1分〜2分程度

        理想回数：30秒×3セット（休憩を含む）
        ======================
        スタートポジション
        ・背筋を伸ばしてまっすぐ立つ
        ・足は肩幅程度に開く
        ・肘を軽く曲げ、手を頭の横に添える
        ======================
        動作説明
        1. 右膝を持ち上げる
        → 同時に上体をひねり、左肘を右膝へ近づける
        2. 元の姿勢に戻る
        → ゆっくり戻し、姿勢を安定させる
        3. 左右を入れ替えて繰り返す
        → 呼吸を止めず、一定のリズムで行う
        ======================
        注意点
        ・反動を使わず、ゆっくりコントロールした動作を意識する
        ・腰や膝に違和感がある場合は無理をしない
        ・バランスが不安な場合は壁のそばで行う
        ======================
        期待できる効果
        ・体幹の安定性向上
        ・股関節まわりの可動域改善
        ・姿勢のリセットと軽い有酸素刺激
      

      image_urls:
      - "https://drive.google.com/uc?export=view&id=1CXPA2Qg7E6SIeux-bLtnWrIJb8RWhOUU"
      
