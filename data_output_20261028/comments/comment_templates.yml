    templates:
      - |

  any:
    templates:
      - |
        こんにちは！
        🚶 隙間時間を検知しました！ウォーキングを行ってみませんか？
        ウォーキングは全身の大きな筋肉を使う有酸素運動で、姿勢改善や血行促進、
        気分のリフレッシュにつながる手軽で効果的な運動です。
        短い時間でも継続することで十分な健康効果が期待できます。
        ======================
        ウォーキングガイド
        歩行時間の目安：5～10分から開始し、慣れてきたら15～20分へ延長
        歩くペース：普段よりやや早歩きを意識
        ======================
        スタートポジション
        ・背筋を伸ばす
        ・視線は5～10m先を見る
        ・肩の力を抜く
        ・腕は自然に振る
        ======================
        動作説明
        1. 背筋を伸ばし、自然な姿勢で歩き始める → 姿勢が整うことで効率よく全身を動かせる
        2. 歩幅を普段より少し大きくする → 下半身の筋肉がより使われ、運動強度が上がる
        3. 肘を軽く曲げて腕を後ろへ引くように振る → 体幹が安定し、歩行リズムが整う
        4. 着地はかかとから行い、つま先へ体重移動する → 足首・膝への負担が軽減される
        ======================
        注意点
        ・猫背にならないようにする
        ・呼吸を止めない
        ・痛みがある場合は無理をしない
        ・靴はクッション性のあるものを使用する
        ======================
        効果
        ・心肺機能の向上
        ・脂肪燃焼の促進
        ・下半身の筋力維持
        ・気分転換やストレス軽減
        ======================
      - |
        こんにちは！
        ⬆️ 隙間時間を検知しました！階段を使ってみませんか？
        階段の上り下りは短時間でも下半身の大きな筋肉をしっかり使える効果的な運動です。
        消費カロリーも歩行より高く、心肺機能の向上や日常動作の改善にもつながります。
        ======================
        階段昇降ガイド
        時間の目安：30秒〜1分から開始、慣れてきたら2〜3分へ延長
        上るペース：普段より少し早歩きを意識
        ======================
        スタートポジション
        ・背筋を伸ばす
        ・視線は足元ではなく1〜2段先を見る
        ・手すりの使用は必要に応じて
        ・つま先と膝の向きは正面に揃える
        ======================
        動作説明
        1. 一段ずつ確実に踏み込みながら上る → 大腿四頭筋・臀部が効果的に使われる
        2. かかとまでしっかり乗せる → 膝への負担が軽減される
        3. 下りはゆっくり一定のリズムで行う → 転倒予防になり安全性が高まる
        4. 呼吸は止めずに自然に続ける → 心肺機能の向上につながる
        ======================
        注意点
        ・急いで駆け上がらない
        ・手すりは必要に応じて使用する
        ・膝や腰に痛みがある場合は無理をしない
        ・濡れた階段では実施しない
        ======================
        効果
        ・下半身の筋力アップ
        ・日常動作の改善（立ち上がり・歩行時の安定）
        ・消費カロリー増加
        ・心肺機能の向上
        ======================


      # Add an optional image URL for this activity (leave empty for none).
