no_activity:
  any:
    templates:
      - |
        こんにちは！
        🪑 座り時間が続いています。ふくらはぎトレーニング（カーフレイズ）を行いませんか？
        ふくらはぎは“第二の心臓”と言われ、座り姿勢が長く続くと血流が滞りやすくなります。
        短時間でも動かすことで、足のだるさや集中力の低下を防ぐことができます。
        ======================
        🦵 ふくらはぎトレーニング（カーフレイズ）
        回数の目安: 15回 × 1セット
        所要時間: 約40〜50秒
        ======================
        🏁 スタートポジション
        ・椅子に浅く座り、背筋を伸ばす
        ・膝は90度に曲げ、足は肩幅
        ・かかとは床につけたままスタート
        ======================
        ⬇️ 動作
        1. かかとをゆっくり持ち上げる
          → ふくらはぎの収縮を意識する
        2. 一番高い位置で1秒止める
        3. ゆっくりかかとを下ろす
          → 反動を使わずコントロールする
        ======================
        ⚠️ 注意点
        ・呼吸を止めない
        ・背中が丸まらないようにする
        ・痛みがある場合は無理をしない
        ======================
        📈 効果
        ・血流改善
        ・足のむくみ予防
        ・座り疲れのリセット
      - |
        こんにちは！
        🙆 立ち上がってリフレッシュしましょう！
        長時間同じ姿勢が続くと肩や体側が固まりやすく、集中力も低下しやすくなります。
        短時間のストレッチで姿勢と気分を整えましょう。
        ======================
        🙋 サイドストレッチ（体側のばし）
        左右各20秒ずつ
        所要時間: 約40秒
        ======================
        🏁 スタートポジション
        ・肩幅に立ち、片手を頭の上に伸ばす
        ・反対の手は体側に自然に添える
        ======================
        ⬇️ 動作
        1. 伸ばした腕とは反対方向へゆっくり体を倒す
        → 脇腹から体側が気持ちよく伸びる位置で止める
        2. 呼吸を続けながら20秒キープ
        3. 反対側も同じように行う
        ======================
        ⚠️ 注意点
        ・反動を使わず、ゆっくり倒す
        ・呼吸を止めない
        ・痛みが出るほど深く倒さない
        ======================
        📈 効果
        ・肩こり予防
        ・体側の柔軟性アップ
        ・姿勢リセットと集中力向上

      - |
       こんにちは！
        隙間時間を検知しました。短時間で上半身をしっかり動かしましょう。

        💪 腕立て伏せ（プッシュアップ）
        腕立て伏せは、胸・腕・肩・体幹をまとめて使う基本的な自重トレーニングです。
        短時間でも筋肉にしっかり刺激が入り、姿勢改善や基礎代謝向上につながります。

        ======================
        エクササイズガイド
        回数の目安：8回〜12回
        運動時間：30秒〜1分程度
        ======================
        スタートポジション
        ・床にうつ伏せになり、両手を肩の真下につく
        ・足は腰幅程度に開く
        ・頭からかかとまで一直線を意識する
        ======================
        動作説明
        1. 肘を曲げて体を下ろす
        → 胸を床に近づけるイメージでゆっくり下ろす
        2. 床を押して体を持ち上げる
        → 肘を伸ばし、元の姿勢に戻る
        3. 動作を繰り返す
        → 体は一直線を保ち、呼吸を止めない
        ======================
        注意点
        ・腰が反ったり、お尻が上がりすぎないよう注意する
        ・肘は外に開きすぎず、やや内側を意識する
        ・きつい場合は膝を床につけて行ってもよい
        ======================
        期待できる効果
        ・胸・腕・肩の筋力向上
        ・体幹の安定性向上
        ・姿勢改善と基礎代謝アップ


